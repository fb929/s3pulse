# s3pulse - MinIO Warp benchmarks against an S3-compatible endpoint.
#
# Default run:          docker compose run --rm s3pulse-runner
# Local smoke test:     make selftest
# Monitoring (loop):    docker compose --file docker-compose.yml --file docker-compose.monitoring.yml up --detach
#
# All settings come from .env (see .env.example). Values below are only defaults.

x-runner-common: &runner-common
  build:
    context: .
    args:
      WARP_IMAGE: ${WARP_IMAGE:-minio/warp:latest}
  image: s3pulse-runner:${S3PULSE_VERSION:-0.1.0}
  volumes:
    # Bind mount so results are visible on the host (named volumes live inside the
    # Docker Desktop VM on macOS). Override with RESULTS_PATH in .env.
    - ${RESULTS_PATH:-./results}:/results

services:
  # Runner targeting the real (external) S3-compatible endpoint.
  s3pulse-runner:
    <<: *runner-common
    container_name: s3pulse-runner
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env (host:port, no scheme)}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-s3pulse}
      S3_TLS: ${S3_TLS:-false}
      S3_TLS_INSECURE: ${S3_TLS_INSECURE:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_LOOKUP: ${S3_LOOKUP:-path}
      PROFILE: ${PROFILE:-probe}
      DEFAULT_DURATION: ${DEFAULT_DURATION:-30}
      DEFAULT_CONCURRENCY: ${DEFAULT_CONCURRENCY:-4}
      SINK_TYPE: ${SINK_TYPE:-stub}
      SINK_URL: ${SINK_URL:-}
      SINK_HTTP_BEARER_TOKEN: ${SINK_HTTP_BEARER_TOKEN:-}
      RUN_LABEL: ${RUN_LABEL:-default}
      RUN_INTERVAL_SECONDS: ${RUN_INTERVAL_SECONDS:-}
      DRY_RUN: ${DRY_RUN:-false}
      WARP_EXTRA_ARGS: ${WARP_EXTRA_ARGS:-}

  # Local S3-compatible server used only by the `selftest` profile. Never touches
  # the real storage. SeaweedFS is used because MinIO images are no longer
  # anonymously pullable (removed from Docker Hub, quay.io requires login).
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY create a static admin identity
  # (weed/s3api/auth_credentials.go); buckets are auto-created for admins.
  s3-selftest:
    image: ${SELFTEST_S3_IMAGE:-chrislusf/seaweedfs:latest}
    profiles: ["selftest"]
    container_name: s3pulse-s3-selftest
    command: ["server", "-s3", "-s3.port=9000", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: s3pulse-selftest
      AWS_SECRET_ACCESS_KEY: s3pulse-selftest-secret
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:9000/status"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  # Runner targeting the local S3 server (profile `selftest`): short durations, stub sink.
  s3pulse-selftest:
    <<: *runner-common
    profiles: ["selftest"]
    container_name: s3pulse-selftest
    depends_on:
      s3-selftest:
        condition: service_healthy
    environment:
      S3_ENDPOINT: s3-selftest:9000
      S3_ACCESS_KEY: s3pulse-selftest
      S3_SECRET_KEY: s3pulse-selftest-secret
      S3_BUCKET: s3pulse-selftest
      S3_TLS: "false"
      S3_TLS_INSECURE: "false"
      S3_REGION: us-east-1
      S3_LOOKUP: path
      PROFILE: ${PROFILE:-probe}
      DEFAULT_DURATION: ${SELFTEST_DURATION:-5}
      DEFAULT_CONCURRENCY: ${DEFAULT_CONCURRENCY:-4}
      SINK_TYPE: ${SINK_TYPE:-stub}
      SINK_URL: ${SINK_URL:-}
      SINK_HTTP_BEARER_TOKEN: ${SINK_HTTP_BEARER_TOKEN:-}
      RUN_LABEL: selftest
      RUN_INTERVAL_SECONDS: ""
      DRY_RUN: ${DRY_RUN:-false}
      WARP_EXTRA_ARGS: ${WARP_EXTRA_ARGS:-}
